name: Tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[security]'
      - run: python -m unittest discover -s tests -v
      - run: python tools/generate_messages.py --check
  browser-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/*.test.mjs
  azurite-integration:
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_CONNECTION_STRING: 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[azure]'
      - run: docker run -d --name azurite -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite azurite-blob --blobHost 0.0.0.0
      - run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:10000/; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python -m unittest discover -s integration -v
      - if: failure()
        run: docker logs azurite
      - if: always()
        run: docker rm -f azurite || true
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python browser_tests/smoke.py
