[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglotblobkit"
version = "0.4.0"
description = "UUID object keys, reversible Unicode filenames and upload size limits"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
azure = ["azure-storage-blob>=12,<13"]
security = ["PyJWT[crypto]>=2.10.1,<3"]

[tool.setuptools.packages.find]
include = ["blob_filename_fix*", "polyglotblobkit*"]

[tool.setuptools.package-data]
blob_filename_fix = ["messages.json"]
