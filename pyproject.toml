[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-blob-filename-fix"
version = "0.3.0"
description = "UUID object keys, reversible Unicode filenames and upload size limits"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
azure = ["azure-storage-blob>=12,<13"]

[tool.setuptools.packages.find]
include = ["blob_filename_fix*"]
